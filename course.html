<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course d'escargots</title>
</head>
<body bgcolor="#c0c0c0" text="#000000" link="#0000cc" vlink="#551a8b">

  <center>

    <table border="3" cellpadding="8" cellspacing="2" bgcolor="#ffffff" width="700">
      <tr>
        <td bgcolor="#000080" align="center">
          <font face="Times New Roman" color="#ffff00" size="5">
            <b>COURSE D'ESCARGOTS</b>
          </font>
          <br>
          <font face="Times New Roman" color="#c0c0c0" size="2">
            (réalisée dans le respect des animaux considérés)
          </font>
        </td>
      </tr>
    </table>

    <br>

    <!-- CHOIX DE L'ESCARGOT -->
    <table border="3" cellpadding="10" cellspacing="2" bgcolor="#ffffff" width="700" id="choix-table">
      <tr>
        <td bgcolor="#800000" colspan="4" align="center">
          <font face="Times New Roman" color="#ffffff" size="3"><b>Choisissez un escargot :</b></font>
        </td>
      </tr>
      <tr>
        <td align="center" bgcolor="#eeeeee" id="btn-0" onclick="choisir(0)"
          style="cursor:pointer; border: 2px solid #aaaaaa;">
          <img src="assets/images/escargots/riri.png" width="80" alt="Riri"
            onerror="this.style.fontSize='40px'; this.alt='🐌'"><br>
          <font face="Times New Roman" size="3"><b>Riri</b></font>
        </td>
        <td align="center" bgcolor="#eeeeee" id="btn-1" onclick="choisir(1)"
          style="cursor:pointer; border: 2px solid #aaaaaa;">
          <img src="assets/images/escargots/fifi.png" width="80" alt="Fifi"
            onerror="this.style.fontSize='40px'; this.alt='🐌'"><br>
          <font face="Times New Roman" size="3"><b>Fifi</b></font>
        </td>
        <td align="center" bgcolor="#eeeeee" id="btn-2" onclick="choisir(2)"
          style="cursor:pointer; border: 2px solid #aaaaaa;">
          <img src="assets/images/escargots/loulou.png" width="80" alt="Loulou"
            onerror="this.style.fontSize='40px'; this.alt='🐌'"><br>
          <font face="Times New Roman" size="3"><b>Loulou</b></font>
        </td>
        <td align="center" bgcolor="#eeeeee" id="btn-3" onclick="choisir(3)"
          style="cursor:pointer; border: 2px solid #aaaaaa;">
          <img src="assets/images/escargots/xp500.png" width="80" alt="XP 500 TMAX"
            onerror="this.style.fontSize='40px'; this.alt='🐌'"><br>
          <font face="Times New Roman" size="3"><b>XP 500 TMAX</b></font>
        </td>
      </tr>
      <tr>
        <td colspan="4" align="center" bgcolor="#ffffff">
          <font face="Times New Roman" size="2" color="#888888"><i>cliquez sur votre champion</i></font>
        </td>
      </tr>
    </table>

    <br>

    <!-- PISTE DE COURSE -->
    <table border="3" cellpadding="4" cellspacing="2" bgcolor="#ffffff" width="700" id="piste-table" style="display:none;">
      <tr>
        <td bgcolor="#800000" colspan="2" align="center">
          <font face="Times New Roman" color="#ffffff" size="3"><b>EN PISTE !</b></font>
          &nbsp;&nbsp;
          <font face="Times New Roman" color="#ffff00" size="2" id="choix-affiche"></font>
        </td>
      </tr>

      <!-- Piste escargot 0 -->
      <tr bgcolor="#eeeeee">
        <td width="80" align="center">
          <font face="Times New Roman" size="2"><b>Riri</b></font>
        </td>
        <td bgcolor="#90ee90" style="position:relative; height:50px; padding:0;">
          <div style="position:relative; width:100%; height:50px; background:#90ee90;">
            <div style="position:absolute; left:0; top:5px; width:40px; height:40px; background:#228B22; border-radius:2px; font-size:24px; text-align:center; line-height:40px;" id="e0">🐌</div>
            <div style="position:absolute; right:0; top:0; bottom:0; width:4px; background:#cc0000;"></div>
          </div>
        </td>
      </tr>

      <!-- Piste escargot 1 -->
      <tr bgcolor="#ffffff">
        <td width="80" align="center">
          <font face="Times New Roman" size="2"><b>Fifi</b></font>
        </td>
        <td bgcolor="#90ee90" style="position:relative; height:50px; padding:0;">
          <div style="position:relative; width:100%; height:50px; background:#adff2f;">
            <div style="position:absolute; left:0; top:5px; width:40px; height:40px; font-size:24px; text-align:center; line-height:40px;" id="e1">🐌</div>
            <div style="position:absolute; right:0; top:0; bottom:0; width:4px; background:#cc0000;"></div>
          </div>
        </td>
      </tr>

      <!-- Piste escargot 2 -->
      <tr bgcolor="#eeeeee">
        <td width="80" align="center">
          <font face="Times New Roman" size="2"><b>Loulou</b></font>
        </td>
        <td bgcolor="#90ee90" style="position:relative; height:50px; padding:0;">
          <div style="position:relative; width:100%; height:50px; background:#90ee90;">
            <div style="position:absolute; left:0; top:5px; width:40px; height:40px; font-size:24px; text-align:center; line-height:40px;" id="e2">🐌</div>
            <div style="position:absolute; right:0; top:0; bottom:0; width:4px; background:#cc0000;"></div>
          </div>
        </td>
      </tr>

      <!-- Piste escargot 3 -->
      <tr bgcolor="#ffffff">
        <td width="80" align="center">
          <font face="Times New Roman" size="2"><b>XP 500 TMAX</b></font>
        </td>
        <td bgcolor="#adff2f" style="position:relative; height:50px; padding:0;">
          <div style="position:relative; width:100%; height:50px; background:#adff2f;">
            <div style="position:absolute; left:0; top:5px; width:40px; height:40px; font-size:24px; text-align:center; line-height:40px;" id="e3">🐌</div>
            <div style="position:absolute; right:0; top:0; bottom:0; width:4px; background:#cc0000;"></div>
          </div>
        </td>
      </tr>

      <tr>
        <td colspan="2" align="center" bgcolor="#ffffff">
          <br>
          <input type="button" value=">>> PARTEZ ! <<<" id="btn-start" onclick="lancerCourse()"
            style="font-family: Times New Roman; font-size: 14px; background: #000080; color: #ffff00; border: 2px outset #ffe484; padding: 6px 14px; cursor: pointer;">
          <br><br>
        </td>
      </tr>
    </table>

    <br>

    <!-- MESSAGE RESULTAT -->
    <table border="3" cellpadding="12" cellspacing="2" bgcolor="#ffffff" width="700" id="resultat-table" style="display:none;">
      <tr>
        <td bgcolor="#000080" align="center">
          <font face="Times New Roman" color="#ffff00" size="4" id="resultat-msg"></font>
        </td>
      </tr>
      <tr>
        <td align="center">
          <br>
          <input type="button" value=">>> Rejouer <<<" onclick="rejouer()"
            style="font-family: Times New Roman; font-size: 14px; background: #800000; color: #ffff00; border: 2px outset #ffe484; padding: 6px 14px; cursor: pointer;">
          <br><br>
        </td>
      </tr>
    </table>

    <br>

    <table border="1" cellpadding="4" width="700" bgcolor="#ffffff">
      <tr>
        <td align="center">
          <font face="Times New Roman" size="1" color="#888888">
            <a href="bibliotheque.html">retour à la bibliothèque</a>
            &nbsp;|&nbsp;
            <a href="index.html">retour à l'accueil</a>
            &nbsp;|&nbsp;
            antoooin.github.io
          </font>
        </td>
      </tr>
    </table>

  </center>

  <script>
    const noms = ["Riri", "Fifi", "Loulou", "XP 500 TMAX"];
    let choix = -1;
    let animInterval = null;
    let positions = [0, 0, 0, 0];
    let vitesses  = [0, 0, 0, 0];
    let courseTerminee = false;

    function choisir(i) {
      choix = i;
      // Highlight du choix
      for(let k = 0; k < 4; k++) {
        document.getElementById('btn-' + k).style.border = '2px solid #aaaaaa';
        document.getElementById('btn-' + k).style.background = '#eeeeee';
      }
      document.getElementById('btn-' + i).style.border = '3px solid #ffff00';
      document.getElementById('btn-' + i).style.background = '#000080';

      // Après un court délai, passer à la piste
      setTimeout(() => {
        document.getElementById('choix-table').style.display = 'none';
        document.getElementById('piste-table').style.display = '';
        document.getElementById('choix-affiche').innerHTML =
          'Vous avez choisi : <b>' + noms[i] + '</b>';
      }, 400);
    }

    function lancerCourse() {
      document.getElementById('btn-start').disabled = true;
      courseTerminee = false;
      positions = [0, 0, 0, 0];

      // Vitesses aléatoires entre 0.3 et 1.0
      vitesses = vitesses.map(() => 0.3 + Math.random() * 0.7);

      // Largeur de la piste (en px, approximée)
      const piste = document.getElementById('e0').parentElement.offsetWidth - 50;

      animInterval = setInterval(() => {
        if(courseTerminee) return;

        let gagnant = -1;
        for(let i = 0; i < 4; i++) {
          positions[i] += vitesses[i];
          const el = document.getElementById('e' + i);
          const maxPos = el.parentElement.offsetWidth - 45;
          const pos = Math.min(positions[i] * 2, maxPos);
          el.style.left = pos + 'px';

          if(positions[i] * 2 >= maxPos && gagnant === -1) {
            gagnant = i;
          }
        }

        if(gagnant !== -1) {
          clearInterval(animInterval);
          courseTerminee = true;
          setTimeout(() => afficherResultat(gagnant), 300);
        }
      }, 30);
    }

    function afficherResultat(gagnant) {
      const msg = document.getElementById('resultat-msg');
      if(gagnant === choix) {
        msg.innerHTML = '🎉 BRAVO ! ' + noms[gagnant] + ' a gagné !<br><font size="3">Belle perf.</font>';
      } else {
        msg.innerHTML = 'Dommage... ' + noms[gagnant] + ' a gagné.<br><font size="3">Mais ' + noms[choix] + ' a fait une super course, on est fier.e.s de lui.</font>';
      }
      document.getElementById('resultat-table').style.display = '';
    }

    function rejouer() {
      choix = -1;
      positions = [0, 0, 0, 0];
      for(let i = 0; i < 4; i++) {
        const el = document.getElementById('e' + i);
        el.style.left = '0px';
      }
      document.getElementById('resultat-table').style.display = 'none';
      document.getElementById('piste-table').style.display = 'none';
      document.getElementById('choix-table').style.display = '';
      document.getElementById('btn-start').disabled = false;
      for(let k = 0; k < 4; k++) {
        document.getElementById('btn-' + k).style.border = '2px solid #aaaaaa';
        document.getElementById('btn-' + k).style.background = '#eeeeee';
      }
    }
  </script>

</body>
</html>
